<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0f12" media="(prefers-color-scheme: dark)">
  <title>pi dashboard</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="loading">

      <symbol id="i-temp" viewBox="0 0 24 24"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></symbol>

      <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M12 20h.01M2 8.82a15 15 0 0 1 20 0M5 12.86a10 10 0 0 1 14 0M8.5 16.43a5 5 0 0 1 7 0"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="i-logs" viewBox="0 0 24 24"><path d="m4 17 6-6-6-6M12 19h8"/></symbol>
      <symbol id="i-restart" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></symbol>
      <symbol id="i-update" viewBox="0 0 24 24"><path d="M12 15V3M7 10l5 5 5-5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></symbol>

      <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 2v10M18.4 6.6a9 9 0 1 1-12.77.04"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></symbol>

      <symbol id="i-x-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>

      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-box" viewBox="0 0 24 24"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12M3.3 7l8.7 5 8.7-5M7.5 4.27l9 5.15"/></symbol>

    </defs>
  </svg>

  <header class="top">
    <div class="brand">
      <img class="logo" src="/static/icon.svg" alt="" width="36" height="36">
      <div>
        <h1 id="host">pi</h1>
        <p class="muted small" id="model">&nbsp;</p>
      </div>
    </div>
    <div class="top-right">
      <span class="pill" id="overall"><span class="dot"></span><span class="pill-text">Connecting…</span></span>
      <div class="menu-wrap">
        <button class="btn icon" id="mute-btn" aria-haspopup="menu" aria-expanded="false" title="Discord alerts"><svg class="i"><use href="#i-bell"/></svg></button>
        <div class="menu" id="mute-menu" role="menu">
          <p class="menu-label">Mute Discord alerts</p>
          <button role="menuitem" data-mute="1">For 1 hour</button>
          <button role="menuitem" data-mute="4">For 4 hours</button>
          <button role="menuitem" data-mute="24">For 24 hours</button>
          <button role="menuitem" data-mute="0" id="unmute-item" hidden>Turn alerts back on</button>
        </div>
      </div>
      <div class="menu-wrap">
        <button class="btn icon" id="more-btn" aria-haspopup="menu" aria-expanded="false" title="More"><svg class="i"><use href="#i-more"/></svg></button>
        <div class="menu" id="more-menu" role="menu">
          <button role="menuitem" id="test-alert"><svg class="i"><use href="#i-send"/></svg>Send a test alert</button>
          <button role="menuitem" id="send-digest"><svg class="i"><use href="#i-sun"/></svg>Send the morning summary now</button>
          <hr>
          <button role="menuitem" id="pi-reboot"><svg class="i"><use href="#i-restart"/></svg>Restart the Pi</button>
          <button role="menuitem" id="pi-poweroff" class="danger"><svg class="i"><use href="#i-power"/></svg>Shut down the Pi</button>
          <hr class="auth-only" hidden>
          <button role="menuitem" id="sign-out" class="auth-only" hidden><svg class="i"><use href="#i-x"/></svg>Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <main>
    <section aria-label="The Pi">
      <div class="stats" id="stats"></div>
      <div class="info" id="info"></div>
    </section>

    <section>
      <div class="section-head"><h2>Services</h2></div>
      <div id="services" class="services"></div>
    </section>

    <section>
      <div class="section-head">
        <h2>Activity</h2>
        <div class="seg" role="tablist" id="feed-filter">
          <button role="tab" data-filter="problems" aria-selected="true">Problems</button>
          <button role="tab" data-filter="all" aria-selected="false">Everything</button>
        </div>
      </div>
      <ol class="feed" id="feed"></ol>
    </section>
  </main>

  <aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawer-title">
    <div class="drawer-head">
      <div class="drawer-title-row">
        <div>
          <h3 id="drawer-title">Logs</h3>
          <p class="muted small" id="drawer-sub"><span class="live-dot"></span><span id="drawer-sub-text"></span></p>
        </div>
        <button class="btn icon" id="drawer-close" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button>
      </div>
      <div class="drawer-tools" id="log-tools">
        <label class="search"><svg class="i"><use href="#i-search"/></svg><input id="log-search" type="search" placeholder="Filter lines" autocomplete="off" spellcheck="false"></label>
        <label class="check"><input type="checkbox" id="errors-only"> Errors only</label>
        <label class="check"><input type="checkbox" id="wrap" checked> Wrap</label>
      </div>
    </div>
    <div class="log wrap" id="log" tabindex="0"></div>
    <button class="btn jump" id="jump" hidden><svg class="i"><use href="#i-arrow-down"/></svg>Jump to latest</button>
  </aside>
  <div class="scrim" id="scrim"></div>

  <dialog id="confirm">
    <form method="dialog">
      <h3 id="confirm-title"></h3>
      <p id="confirm-body" class="muted"></p>
      <div class="dialog-actions">
        <button class="btn" value="cancel">Cancel</button>
        <button class="btn primary" value="ok" id="confirm-ok">OK</button>
      </div>
    </form>
  </dialog>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script src="/static/app.js"></script>
</body>
</html>
